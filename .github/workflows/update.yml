name: Update Oak Ridges 55+ schedule

on:
  schedule:
    # Every Monday 13:00 UTC (~9am Toronto time; shifts by 1hr with DST, that's fine)
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_and_build.py

      - name: Commit updated data.json (if changed)
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Auto-update schedule ($(date -u +%Y-%m-%d))"
          git push
